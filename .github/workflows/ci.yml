name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      # The package bundles the vendor's 7 MB freeware ZIP, so the store
      # alone saves a full re-unpack on every run.
      - uses: cachix/cachix-action@v15
        if: github.event_name == 'push' && github.repository_owner == 'varsoug'
        with:
          name: varsoug
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Build the package
        run: nix build --print-build-logs .#phonerlite

      - name: Check the flake outputs
        run: nix flake check

      - name: Run the package
        # No X server on the runner: only check that the launcher starts and
        # reaches Wine without a missing dependency.
        run: |
          (timeout 20 ./result/bin/phonerlite > launch.log 2>&1 || true)
          if grep -qF 'command not found' launch.log; then
            echo "Launcher has a missing dependency"
            cat launch.log
            exit 1
          fi

      - name: Check the desktop entry
        run: |
          chmod +x result/share/applications/phonerlite.desktop || true
          if ! grep -q '^Exec=phonerlite$' result/share/applications/phonerlite.desktop; then
            echo "Desktop entry does not point at the launcher"
            exit 1
          fi
          test -f result/share/icons/hicolor/256x256/apps/phonerlite.png
